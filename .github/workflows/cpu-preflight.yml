name: CPU preflight CLI
on:
  push:
    paths:
      - cpu_preflight.py
      - tests/test_cpu_preflight.py
      - .github/workflows/cpu-preflight.yml
  pull_request:
    paths:
      - cpu_preflight.py
      - tests/test_cpu_preflight.py
      - .github/workflows/cpu-preflight.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_cpu_preflight.py -v
      - run: python -m py_compile cpu_preflight.py tests/test_cpu_preflight.py
