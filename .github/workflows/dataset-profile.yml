name: CPU dataset profile
on:
  pull_request:
    paths:
      - 'scripts/dataset_profile.py'
      - 'tests/test_dataset_profile.py'
      - '.github/workflows/dataset-profile.yml'
  workflow_dispatch:
jobs:
  dataset-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_dataset_profile.py' -v
      - name: Syntax check
        run: python -m py_compile scripts/dataset_profile.py tests/test_dataset_profile.py
